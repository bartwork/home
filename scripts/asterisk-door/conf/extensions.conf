[general]
static=yes
writeprotect=no

; Calls from door station → ring softphones
[from-door]
exten => 1,1,NoOp(Door button ${CALLERID(all)} -> softphones)
 same => n,Dial(PJSIP/101&PJSIP/102,45)
 same => n,Hangup()

exten => 101,1,Dial(PJSIP/101,45)
 same => n,Hangup()

exten => 102,1,Dial(PJSIP/102,45)
 same => n,Hangup()

exten => _X.,1,NoOp(Door dialed ${EXTEN})
 same => n,Dial(PJSIP/101&PJSIP/102,45)
 same => n,Hangup()

exten => s,1,Dial(PJSIP/101&PJSIP/102,45)
 same => n,Hangup()

; Softphones can call door or each other
[from-internal]
; Hikvision часто принимает только вызов «как с комнаты» (Room/SIP Number 1).
exten => 100,1,NoOp(Call door from ${CALLERID(all)})
 same => n,Set(CALLERID(num)=1)
 same => n,Set(CALLERID(name)=Indoor)
 same => n,Dial(PJSIP/100,45)
 same => n,NoOp(door dialstatus=${DIALSTATUS} cause=${HANGUPCAUSE})
 same => n,Hangup()

exten => 101,1,Dial(PJSIP/101,45)
exten => 102,1,Dial(PJSIP/102,45)

exten => *9,1,NoOp(DTMF unlock from ${CHANNEL})
 same => n,Hangup()
