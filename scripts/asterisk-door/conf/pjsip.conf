; Local test PBX for Hikvision door station
; Host LAN IP: 192.168.1.9

[global]
type=global
endpoint_identifier_order=username,ip,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=192.168.1.9
external_signaling_address=192.168.1.9
local_net=192.168.1.0/24
local_net=10.0.0.0/8
local_net=172.16.0.0/12

; ---- Door station (Hikvision DS-KV6103) ----
[100]
type=endpoint
context=from-door
disallow=all
allow=ulaw,alaw,g722,h264
auth=100
aors=100
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
timers=yes
dtmf_mode=rfc4733
media_use_received_transport=yes
rtp_timeout=60
max_audio_streams=1
max_video_streams=1

[100]
type=auth
auth_type=userpass
username=100
password=door100test

[100]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30

; ---- Softphone for answering (Linphone / Zoiper) ----
[101]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw,g722,opus,h264
auth=101
aors=101
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
media_use_received_transport=yes
max_audio_streams=1
max_video_streams=1

[101]
type=auth
auth_type=userpass
username=101
password=soft101test

[101]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30

