openapi: 3.0.0
info:
    title: home API
    version: v0.0.1
servers:
    - url: http://localhost:9000
paths:
    /api/v1/users:
        get:
            tags:
                - users
            summary: Список пользователей
            responses:
                "200":
                    description: Successful operation
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/responseUsersListUsers'
        post:
            tags:
                - users
            summary: Создать пользователя
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/requestUsersCreateUser'
            responses:
                "201":
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/responseUsersCreateUser'
    /api/v1/users/{id}:
        get:
            tags:
                - users
            summary: Пользователь
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: number
                    format: int64
            responses:
                "200":
                    description: Successful operation
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/responseUsersGetUser'
        put:
            tags:
                - users
            summary: Обновить пользователя
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: number
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/requestUsersUpdateUser'
            responses:
                "200":
                    description: Successful operation
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/responseUsersUpdateUser'
        delete:
            tags:
                - users
            summary: Удалить пользователя
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: number
                    format: int64
            responses:
                "204":
                    description: No Content
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/responseUsersDeleteUser'
components:
    schemas:
        dto.CreateUser:
            type: object
            required:
                - lastName
                - firstName
                - secondName
                - email
                - phone
                - password
            properties:
                active:
                    oneOf:
                        - type: boolean
                        - nullable: true
                email:
                    type: string
                firstName:
                    type: string
                lastName:
                    type: string
                password:
                    type: string
                phone:
                    type: string
                secondName:
                    type: string
        dto.UpdateUser:
            type: object
            required:
                - lastName
                - firstName
                - secondName
                - email
                - phone
                - active
            properties:
                active:
                    type: boolean
                email:
                    type: string
                firstName:
                    type: string
                lastName:
                    type: string
                password:
                    oneOf:
                        - type: string
                        - nullable: true
                phone:
                    type: string
                secondName:
                    type: string
        dto.User:
            type: object
            required:
                - id
                - lastName
                - firstName
                - secondName
                - email
                - phone
                - active
            properties:
                active:
                    type: boolean
                email:
                    type: string
                firstName:
                    type: string
                id:
                    type: number
                    format: int64
                lastAuthAt:
                    type: string
                lastName:
                    type: string
                phone:
                    type: string
                secondName:
                    type: string
        requestUsersCreateUser:
            type: object
            required:
                - in
            properties:
                in:
                    $ref: '#/components/schemas/dto.CreateUser'
        requestUsersDeleteUser:
            type: object
        requestUsersGetUser:
            type: object
        requestUsersListUsers:
            type: object
        requestUsersUpdateUser:
            type: object
            required:
                - in
            properties:
                in:
                    $ref: '#/components/schemas/dto.UpdateUser'
        responseUsersCreateUser:
            type: object
            required:
                - user
            properties:
                user:
                    $ref: '#/components/schemas/dto.User'
        responseUsersDeleteUser:
            type: object
        responseUsersGetUser:
            type: object
            required:
                - user
            properties:
                user:
                    $ref: '#/components/schemas/dto.User'
        responseUsersListUsers:
            type: object
            required:
                - users
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/dto.User'
                    nullable: true
        responseUsersUpdateUser:
            type: object
            required:
                - user
            properties:
                user:
                    $ref: '#/components/schemas/dto.User'
