version: "2"
sql:
  - engine: "sqlite"
    schema: "schema.sql"
    queries: "queries"
    gen:
      go:
        package: "db"
        out: "../internal/db"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - column: "users.is_active"
            go_type: "bool"
          - column: "users.last_auth_at"
            go_type:
              type: "string"
              pointer: true
