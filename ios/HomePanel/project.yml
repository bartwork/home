name: HomePanel
options:
  bundleIdPrefix: ru.home
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  CocoaMQTT:
    url: https://github.com/emqx/CocoaMQTT
    from: 2.1.6
  linphonesw:
    path: Vendor/linphonesw

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  HomePanel:
    type: application
    platform: iOS
    sources:
      - path: HomePanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.home.homepanel
        PRODUCT_NAME: HomePanel
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HomePanel/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    dependencies:
      - package: CocoaMQTT
        product: CocoaMQTT
      - package: linphonesw
        product: linphonesw
